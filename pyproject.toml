[project]
name = "sfg-app2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Simon", email = "170212564+silanglois@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lmfit>=1.3.4",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyside6>=6.11.1",
    "refractiveindex>=1.0.3",
]

[project.scripts]
sfg-app2 = "sfg_app2:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
