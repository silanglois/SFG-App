[project]
name = "sfg-app2"
version = "1.0.0"
description = "A desktop application for processing and analyzing Sum-Frequency Generation (SFG) spectroscopy data — homodyne and heterodyne — built with PySide6."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Simon Langlois", email = "170212564+silanglois@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aquarel>=0.0.7",
    "lmfit>=1.3.4",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "platformdirs>=4.10.0",
    "pyside6>=6.11.1",
    "refractiveindex>=1.0.3",
    "scipy>=1.18.0",
]

[project.scripts]
sfg-app = "sfg_app2.app.main:run"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pillow>=12.2.0",
    "pyinstaller>=6.0.0",
    "pytest>=9.1.1",
]
