name: Docs

# Build the user guide site with --strict on every change to it, so broken
# links / missing nav entries are caught on push and PR rather than only when
# a release tag is pushed (release.yml runs on tags only).
on:
  push:
    paths:
      - 'src/sfg_app2/app/ressources/user_guide/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'src/sfg_app2/app/ressources/user_guide/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Build user guide site (strict)
        run: uv run mkdocs build --strict
