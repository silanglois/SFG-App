# SFG-App user guide site.
#
# Built with `uv run mkdocs build` into ./site (gitignored), which the app
# bundles as user_guide_site/ and opens in the default browser from
# Help -> User Guide (see src/sfg_app2/app/dialogs/user_guide_dialog.py).
# Everything is tuned to work offline straight off disk (file://), so there
# is no live server and no CDN.
site_name: SFG-App User Guide
site_description: In-depth guide to every tab and settings dialog in SFG-App.
site_author: Simon Langlois
copyright: "GNU General Public License v3.0-or-later"

# The Markdown lives inside the app package so the QTextBrowser fallback
# dialog can read the exact same files (single source of truth).
docs_dir: src/sfg_app2/app/ressources/user_guide
site_dir: site

# Required for file:// -- directory URLs turn links into folder/ paths that
# 404 off disk. The offline plugin also forces this off; set it explicitly.
use_directory_urls: false

theme:
  name: material
  language: en
  # Use the platform font stack -- Material's default pulls Roboto from
  # Google Fonts, which fails (and stalls layout) with no network.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    # Deliberately NOT enabled: navigation.instant / navigation.prefetch
    # (need XHR -> broken under file://); content.action.* (no repo link).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - offline

extra:
  # The offline plugin normally injects the iframe-worker shim from
  # unpkg.com (needed to spawn the search web worker under file://). Point
  # it at a vendored copy instead so search works with no network; the
  # plugin skips its CDN entry when a "iframe-worker" polyfill is present.
  polyfills:
    - javascripts/iframe-worker.min.js

nav:
  - Home: index.md
  - Getting Started: 00_overview.md
  - Load & Match: 01_load_match.md
  - Process & Review — Homodyne: 02_process_review_homodyne.md
  - Process & Review — Heterodyne: 03_process_review_heterodyne.md
  - Spectra Library: 04_results.md
  - Fitting: 05_fitting.md
  - Settings & Preferences: 06_settings_preferences.md
  - Reference & Tips: 07_reference_tips.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Vendored KaTeX (MIT, Khan Academy) -- see stylesheets/KATEX_LICENSE.
extra_javascript:
  - javascripts/katex.min.js
  - javascripts/katex-auto-render.min.js
  - javascripts/arithmatex-katex.js

extra_css:
  - stylesheets/katex.min.css
